name: Sync to HF and ModelScope

on:
  push:
    paths:
      - 'data/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git and LFS
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git lfs install --skip-repo

      - name: Sync to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone "https://oauth2:$HF_TOKEN@huggingface.co/datasets/chenzihong/OmicsBench" hf_repo
          
          cd hf_repo
          git lfs install
          git config lfs.url "https://oauth2:$HF_TOKEN@huggingface.co/datasets/chenzihong/OmicsBench.git/info/lfs"
          git lfs track "data/*.json"
          
          rm -rf data
          cp -r ../data .
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected in HuggingFace repo"
          else
            echo "Changes detected, pushing to HuggingFace"
            git add .gitattributes
            git add .
            git commit -m "Update data from GitHub"
            
            git push origin main
          fi

      - name: Sync to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone "https://oauth2:$MODELSCOPE_TOKEN@www.modelscope.cn/datasets/chenzihong/OmicsBench.git" ms_repo
          
          cd ms_repo
          git lfs install
          git config lfs.url "https://oauth2:$MODELSCOPE_TOKEN@www.modelscope.cn/datasets/chenzihong/OmicsBench.git/info/lfs"
          git lfs track "data/*.json"
          
          rm -rf data
          cp -r ../data .
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected in ModelScope repo"
          else
            echo "Changes detected, pushing to ModelScope"
            git add .gitattributes
            git add .
            git commit -m "Update data from GitHub"
            
            git push origin master
          fi